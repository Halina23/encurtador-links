<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encurtador de Links</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { font-size: 1.75rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .6rem; font-size: 1rem; border: 1px solid #9ca3af; border-radius: .375rem; }
    button { padding: .6rem 1rem; font-size: 1rem; border: 0; border-radius: .375rem; background: #2563eb; color: #fff; cursor: pointer; }
    .result, .error { margin-top: 1.5rem; padding: 1rem; border-radius: .375rem; }
    .result { background: #ecfdf5; border: 1px solid #10b981; }
    .error { background: #fef2f2; border: 1px solid #ef4444; }
  </style>
</head>
<body>
  <h1>Encurtador de Links</h1>
  <form method="post" action="/">
    <input type="text" name="url" placeholder="Cole aqui o link comprido" value="{{ url or '' }}" required>
    <button type="submit">Encurtar</button>
  </form>

  {% if short_url %}
  <div class="result">
    Seu link curto: <a href="{{ short_url }}">{{ short_url }}</a>
  </div>
  {% endif %}

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
</body>
</html>
