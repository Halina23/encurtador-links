[project]
name = "encurtador-links"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.164.0",
    # Exigido pela instrumentação do SQLAlchemy (OpenTelemetry), que importa o
    # módulo asyncio do SQLAlchemy; na 2.1 o greenlet deixou de vir junto.
    "greenlet>=3.5.6",
    "jinja2>=3.1.6",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.3",
    "python-json-logger>=4.2.0",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: erros básicos | I: ordem dos imports | B: padrões que viram bug | UP: sintaxe moderna
select = ["E", "F", "I", "B", "UP"]
