[project]
name = "encurtador-links"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.2",
    "jinja2>=3.1.6",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-json-logger>=4.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: erros básicos | I: ordem dos imports | B: padrões que viram bug | UP: sintaxe moderna
select = ["E", "F", "I", "B", "UP"]
