name: CI

on:
  push:            # todo push, em qualquer branch
  workflow_dispatch:  # botão "Run workflow" para rodar manualmente

# Se chegar um push novo na mesma branch, cancela a execução antiga (economiza tempo).
# Na main nunca cancela, para toda versão publicada passar pelo pipeline inteiro.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Princípio do menor privilégio: por padrão, o token só pode ler o repositório.
permissions:
  contents: read

env:
  UV_VERSION: "0.13.1"  # a mesma do Dockerfile
  UV_PYTHON: "3.12"

jobs:
  lint:
    name: Lint (ruff + hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --frozen
      - run: make lint
      - run: make hadolint

  test:
    name: Testes (pytest + Postgres)
    runs-on: ubuntu-latest
    # Service container: um Postgres de verdade ao lado do runner,
    # igual ao encurtador-test-db da máquina local.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: encurtador
          POSTGRES_PASSWORD: encurtador
          POSTGRES_DB: encurtador_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -h 127.0.0.1 -U encurtador -d encurtador_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run pytest -v

  build:
    name: Build + Trivy (+ publicação na main)
    runs-on: ubuntu-latest
    needs: [lint, test]  # só roda se lint e testes passarem
    permissions:
      contents: read
      packages: write  # necessário para publicar no GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Nomes de imagem precisam ser minúsculos (o usuário é "Halina23").
      - name: Define o nome da imagem
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Gera as tags: sha-<commit completo> sempre, e latest só na main.
      - name: Gera tags e labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build da imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true  # deixa a imagem disponível localmente para o Trivy
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Relatório completo (HIGH e CRITICAL), só para leitura: não reprova.
      - name: Trivy - relatório
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      # Portão de segurança: reprova se houver CRITICAL com correção disponível.
      - name: Trivy - portão (CRITICAL corrigível)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login no GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reaproveita o cache do build anterior, então é rápido.
      - name: Publica no GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
