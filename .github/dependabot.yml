# Dependabot: abre PRs de atualização automaticamente.
# O CI roda em cada PR, então só faça o merge se estiver verde.
version: 2

updates:
  # Dependências Python (pyproject.toml + uv.lock)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      # Junta atualizações pequenas num PR só, para não lotar de PRs.
      python-minor-patch:
        update-types: [minor, patch]

  # Imagem base do Dockerfile (python:3.12-slim)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # Actions usadas nos workflows (atualiza os SHAs fixados)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
